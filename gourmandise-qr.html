<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gourmandise French Pastry &amp; Café — Website Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,500;1,500&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1a16;
      color: #f5f5f0;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      gap: 1.5rem;
    }

    .brand {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #4a7a65;
    }

    .shop-name {
      font-family: 'Cormorant Garant', serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(2rem, 7vw, 3rem);
      text-align: center;
      line-height: 1.15;
      color: #C9A547;
      letter-spacing: 0.02em;
    }

    .shop-sub {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #4a7a65;
      text-align: center;
      margin-top: -0.75rem;
    }

    .tagline {
      font-size: 0.92rem;
      color: #888;
      text-align: center;
      max-width: 300px;
      line-height: 1.55;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 9 / 16;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(201,165,71,0.15);
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .video-end-overlay {
      position: absolute;
      inset: 0;
      background: #0f1a16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .video-end-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .video-end-overlay p {
      color: #888;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .video-end-overlay span {
      font-size: 1.5rem;
      color: #C9A547;
    }

    .replay-btn {
      background: transparent;
      border: 1px solid #3a5a4a;
      color: #666;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.05em;
      margin-top: 0.25rem;
    }

    .replay-btn:hover {
      border-color: #C9A547;
      color: #C9A547;
    }

    .cta {
      display: inline-block;
      background: #C9A547;
      color: #0f1a16;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 1rem 2rem;
      border-radius: 4px;
      text-decoration: none;
      letter-spacing: 0.03em;
      transition: background 0.2s;
    }

    .cta:hover { background: #e0b94f; }

    .footer {
      font-size: 0.72rem;
      color: #333;
      text-align: center;
    }
  </style>
</head>
<body>

  <p class="brand">BDFink Studios</p>
  <h1 class="shop-name">Gourmandise</h1>
  <p class="shop-sub">French Pastry &amp; Café</p>
  <p class="tagline">Here's a preview of what your website could look like.</p>

  <div class="video-wrapper">
    <iframe
      id="vimeo-player"
      src="https://player.vimeo.com/video/1196525029?autoplay=1&muted=1&loop=0&title=0&byline=0&portrait=0"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
    <div class="video-end-overlay" id="end-overlay">
      <span>&#8595;</span>
      <p>See your full demo below</p>
      <button class="replay-btn" id="replay-btn">&#8635; Replay</button>
    </div>
  </div>

  <a class="cta" href="gourmandise.html">See Your Full Website Demo &rarr;</a>
  <p class="footer">Designed by BDFink Studios &nbsp;&middot;&nbsp; bdfinkstudios.com &nbsp;&middot;&nbsp; Anderson, SC</p>

  <script src="https://player.vimeo.com/api/player.js"></script>
  <script>
    var player = new Vimeo.Player(document.getElementById('vimeo-player'));
    player.on('ended', function() {
      document.getElementById('end-overlay').classList.add('visible');
    });
    document.getElementById('replay-btn').addEventListener('click', function() {
      document.getElementById('end-overlay').classList.remove('visible');
      player.play();
    });
  </script>

</body>
</html>
