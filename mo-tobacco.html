<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mo Tobacco & Vape — Website Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #f5f5f0; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.25rem; gap: 1.75rem; }
    .brand { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: #666; }
    .shop-name { font-family: 'Playfair Display', serif; font-size: clamp(1.75rem, 6vw, 2.75rem); font-weight: 700; text-align: center; line-height: 1.2; }
    .tagline { font-size: 0.95rem; color: #999; text-align: center; max-width: 340px; }
    .video-wrapper { position: relative; width: 100%; max-width: 360px; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; background: #111; box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
    .video-wrapper iframe { width: 100%; height: 100%; border: none; display: block; }
    .video-end-overlay { position: absolute; inset: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
    .video-end-overlay.visible { opacity: 1; pointer-events: auto; }
    .video-end-overlay p { color: #888; font-size: 0.85rem; letter-spacing: 0.05em; }
    .video-end-overlay span { font-size: 1.5rem; }
    .replay-btn { background: transparent; border: 1px solid #555; color: #888; font-family: 'Inter', sans-serif; font-size: 0.8rem; padding: 0.4rem 1rem; border-radius: 4px; cursor: pointer; letter-spacing: 0.05em; margin-top: 0.25rem; }
    .replay-btn:hover { border-color: #888; color: #bbb; }
    .cta { display: inline-block; background: #f5f5f0; color: #0a0a0a; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 1rem; padding: 1rem 2rem; border-radius: 6px; text-decoration: none; letter-spacing: 0.02em; }
    .footer { font-size: 0.72rem; color: #444; text-align: center; }
  </style>
</head>
<body>
  <p class="brand">BDFink Studios</p>
  <h1 class="shop-name">Mo Tobacco & Vape</h1>
  <p class="tagline">Here's a preview of what your website could look like.</p>
  <div class="video-wrapper">
    <iframe id="vimeo-player" src="https://player.vimeo.com/video/1194114560?h=4c84899678&autoplay=1&muted=1&loop=0&title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    <div class="video-end-overlay" id="end-overlay">
      <span>&#8595;</span>
      <p>See your full demo below</p>
      <button class="replay-btn" id="replay-btn">&#8635; Replay</button>
    </div>
  </div>
  <a class="cta" href="mo_tobacco.html">See Your Full Website Demo &rarr;</a>
  <p class="footer">Designed by BDFink Studios &nbsp;&middot;&nbsp; bdfinkstudios.com &nbsp;&middot;&nbsp; Anderson, SC</p>
  <script src="https://player.vimeo.com/api/player.js"></script>
  <script>
    var player = new Vimeo.Player(document.getElementById('vimeo-player'));
    player.on('ended', function() { document.getElementById('end-overlay').classList.add('visible'); });
    document.getElementById('replay-btn').addEventListener('click', function() {
      document.getElementById('end-overlay').classList.remove('visible');
      player.play();
    });
  </script>
</body>
</html>
